<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>SISBANDA Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;padding:24px 16px;gap:16px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:28px 32px;width:100%;max-width:420px}
.logo{font-size:20px;font-weight:bold;color:#C9A64B;letter-spacing:1px}
.subtitle{font-size:11px;color:#555;margin-top:2px;margin-bottom:20px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:12px;border-bottom:1px solid #222}
.row:last-child{border-bottom:none}
.label{color:#777}
.value{color:#eee;font-weight:500;text-align:right;max-width:200px;word-break:break-all}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dot.green{background:#22c55e}.dot.yellow{background:#eab308}.dot.red{background:#ef4444}.dot.gray{background:#555}
.status-chip{display:flex;align-items:center;font-size:13px;font-weight:600;gap:6px}
.section-title{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;margin-top:4px}
.btn{width:100%;padding:9px;border:none;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;transition:opacity .2s;margin-top:6px}
.btn-gold{background:#C9A64B;color:#111}.btn-gold:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid #333;color:#888}.btn-outline:hover{color:#eee;border-color:#555}
.log-box{background:#0d0d0d;border:1px solid #222;border-radius:6px;padding:10px;font-size:11px;font-family:monospace;color:#4ade80;max-height:120px;overflow-y:auto;margin-top:12px;line-height:1.7}
.log-box .err{color:#f87171}
.log-box .info{color:#94a3b8}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:bold}
.badge-green{background:#052e16;color:#4ade80}
.badge-yellow{background:#422006;color:#fbbf24}
.badge-red{background:#2d1a1a;color:#f87171}
.badge-gray{background:#1e1e1e;color:#666}
.update-bar{background:#422006;border:1px solid #6b3300;border-radius:8px;padding:10px 14px;font-size:12px;color:#fbbf24;display:flex;align-items:center;justify-content:space-between;gap:8px}
.update-bar a{color:#fbbf24;font-weight:bold;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>

<!-- Barra de atualização (oculta por padrão) -->
<div class="update-bar" id="updateBar" style="display:none;max-width:420px;width:100%">
  <span>🟡 Nova versão disponível: <span id="updateVersion"></span></span>
  <a id="updateLink" href="#" target="_blank">Atualizar Agora</a>
</div>

<div class="card">
  <div class="logo">SISBANDA Agent</div>
  <div class="subtitle">Polícia Civil da Paraíba</div>

  <div class="status-chip" id="statusChip">
    <span class="dot gray" id="statusDot"></span>
    <span id="statusText">Verificando...</span>
    <span class="badge badge-gray" id="versionBadge">—</span>
  </div>

  <div style="margin-top:20px">
    <div class="section-title">Sistema</div>
    <div class="row"><span class="label">Servidor</span>      <span class="value">http://localhost:9876</span></div>
    <div class="row"><span class="label">WebSocket</span>     <span class="value" id="wsStatus">—</span></div>
    <div class="row"><span class="label">Playwright</span>    <span class="value" id="pwVersion">—</span></div>
    <div class="row"><span class="label">Chromium</span>      <span class="value" id="chromiumStatus">—</span></div>
    <div class="row"><span class="label">Status</span>        <span class="value" id="busyStatus">—</span></div>
    <div class="row"><span class="label">Última execução</span><span class="value" id="lastRun">—</span></div>
  </div>

  <div style="margin-top:20px">
    <div class="section-title">Módulos</div>
    <div id="modulesList" style="font-size:12px;color:#555">Carregando...</div>
  </div>

  <div style="margin-top:20px">
    <div class="section-title">Jobs recentes</div>
    <div id="jobsList" style="font-size:12px;color:#555">—</div>
  </div>

  <div class="log-box" id="logBox"><span class="info">Aguardando eventos...</span></div>

  <button class="btn btn-gold" onclick="refresh()" style="margin-top:16px">Verificar Status</button>
  <button class="btn btn-outline" onclick="runDiagnostics()">Diagnóstico</button>
</div>

<script>
const PORT = 9876;
let ws = null;

function log(msg, type = '') {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  line.className = type;
  const ts = new Date().toLocaleTimeString('pt-BR');
  line.textContent = `[${ts}] ${msg}`;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
  if (box.children.length > 80) box.removeChild(box.firstChild);
}

function conectarWS() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  ws = new WebSocket(`ws://localhost:${PORT}`);
  ws.onopen  = () => { document.getElementById('wsStatus').textContent = '✓ Conectado'; log('WebSocket conectado.', 'info'); };
  ws.onclose = () => { document.getElementById('wsStatus').textContent = '✗ Desconectado'; setTimeout(conectarWS, 5000); };
  ws.onerror = () => { document.getElementById('wsStatus').textContent = '✗ Erro'; };
  ws.onmessage = ({ data }) => {
    try {
      const ev = JSON.parse(data);
      if (ev.event === 'step')         log(`[${ev.module}] ${ev.message}`);
      if (ev.event === 'job_started')  log(`Job iniciado: ${ev.module}`, 'info');
      if (ev.event === 'job_finished') { log(`Job concluído: ${ev.module}`, 'info'); refresh(); }
      if (ev.event === 'job_error')    { log(`Erro: ${ev.error}`, 'err'); refresh(); }
    } catch {}
  };
}

async function refresh() {
  try {
    const [sv, vr, jo] = await Promise.all([
      fetch(`http://localhost:${PORT}/status`).then(r => r.json()),
      fetch(`http://localhost:${PORT}/version`).then(r => r.json()),
      fetch(`http://localhost:${PORT}/jobs`).then(r => r.json()),
    ]);

    document.getElementById('statusDot').className  = 'dot green';
    document.getElementById('statusText').textContent = 'Online';
    document.getElementById('versionBadge').className = 'badge badge-green';
    document.getElementById('versionBadge').textContent = `v${sv.version}`;
    document.getElementById('pwVersion').textContent    = vr.playwright || '—';
    document.getElementById('chromiumStatus').textContent = sv.browserInstalled ? '✓ Instalado' : '✗ Não encontrado';
    document.getElementById('busyStatus').textContent   = sv.busy ? '⏳ Ocupado' : '✓ Disponível';
    document.getElementById('lastRun').textContent      = sv.lastRun ? new Date(sv.lastRun).toLocaleString('pt-BR') : '—';

    // Módulos
    const mods = document.getElementById('modulesList');
    mods.innerHTML = '';
    (vr.modules || []).forEach(m => {
      const d = document.createElement('div');
      d.style.cssText = 'display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1a1a1a';
      d.innerHTML = `<span style="color:#aaa">✓ ${m.description || m.name}</span><span style="color:#555">${m.version}</span>`;
      mods.appendChild(d);
    });
    if (!vr.modules?.length) mods.textContent = '—';

    // Jobs
    const jobsEl = document.getElementById('jobsList');
    const recentes = (jo.jobs || []).slice(0, 5);
    if (!recentes.length) { jobsEl.textContent = 'Nenhum job executado ainda.'; }
    else {
      jobsEl.innerHTML = '';
      recentes.forEach(j => {
        const cls = j.status === 'done' ? 'badge-green' : j.status === 'error' ? 'badge-red' : j.status === 'running' ? 'badge-yellow' : 'badge-gray';
        const d = document.createElement('div');
        d.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1a1a1a;font-size:11px';
        d.innerHTML = `<span style="color:#888">${j.module}</span><span class="badge ${cls}">${j.status}</span>`;
        jobsEl.appendChild(d);
      });
    }

    // Update bar
    const upd = vr.update;
    if (upd?.available) {
      document.getElementById('updateVersion').textContent = upd.version;
      document.getElementById('updateLink').href = upd.downloadUrl || '#';
      document.getElementById('updateBar').style.display = 'flex';
    }

  } catch {
    document.getElementById('statusDot').className    = 'dot red';
    document.getElementById('statusText').textContent = 'Offline';
    document.getElementById('versionBadge').className = 'badge badge-red';
    document.getElementById('versionBadge').textContent = 'offline';
  }
}

async function runDiagnostics() {
  log('Executando diagnóstico...', 'info');
  try {
    const d = await fetch(`http://localhost:${PORT}/diagnostics`).then(r => r.json());
    log(`Agent: ${d.agent ? '✓' : '✗'} | Playwright: ${d.playwright ? '✓' : '✗'} | Chromium: ${d.chromium ? '✓' : '✗'}`);
    log(`Internet: ${d.internet ? '✓' : '✗'} | Escrita: ${d.writePermission ? '✓' : '✗'} | Disco livre: ${d.diskFreeMb ?? '?'} MB`);
    log(`Node: ${d.nodeVersion} | Plataforma: ${d.platform}/${d.arch}`);
  } catch { log('Falha ao obter diagnóstico.', 'err'); }
}

conectarWS();
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
